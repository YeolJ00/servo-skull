name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Weekly rebuild so the published rules packs follow Wahapedia's updates.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Week stamp for the export cache
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Cache the Wahapedia export for a week
        uses: actions/cache@v4
        with:
          path: .cache/wahapedia
          key: wahapedia-export-${{ steps.week.outputs.week }}
      - name: Build rules packs
        run: npm run packs
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
